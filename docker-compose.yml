version: "3.9"

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rfms_postgres
    environment:
      POSTGRES_DB: research_monitoring
      POSTGRES_USER: research_admin
      POSTGRES_PASSWORD: changeme_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_admin -d research_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Redis (Celery broker + cache) ----
  redis:
    image: redis:7-alpine
    container_name: rfms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
